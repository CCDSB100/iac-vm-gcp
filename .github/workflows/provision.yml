name: Provisionar Maquina GCP

on:
  workflow_dispatch:
    inputs:
      squad_name:
        description: 'Nome da sua Squad (ex: squad3, squad-ia)'
        required: true
        default: 'squad-teste'
        type: string
      machine_type:
        description: 'Tipo de Máquina do GCP'
        required: true
        default: 'c4-standard-8'
        type: choice
        options:
          - e2-medium
          - n2-standard-4
          - c4-standard-8
      max_run_duration_seconds:
        description: 'Tempo máximo de execução em segundos (ex: 3600 = 1h)'
        required: true
        default: '3600'
        type: string

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/309462774956/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '309462774956-compute@developer.gserviceaccount.com'

      - name: Configurar o Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        id: tf-apply
        run: |
          terraform apply -auto-approve \
            -var="squad_name=${{ github.event.inputs.squad_name }}" \
            -var="machine_type=${{ github.event.inputs.machine_type }}" \
            -var="max_run_duration_seconds=${{ github.event.inputs.max_run_duration_seconds }}"

      - name: Extrair Outputs e Gerar Sumário
        if: always()
        run: |
          if terraform output -raw instance_name >/dev/null 2>&1; then
            INSTANCE_NAME=$(terraform output -raw instance_name)
            ZONE=$(terraform output -raw zone)
            EXT_IP=$(terraform output -raw external_ip)
            HOURS=$(terraform output -raw duration_hours)
            
            # Calcula a expiração convertendo para o Horário de Brasília
            EXPIRY_TIME=$(TZ='America/Sao_Paulo' date -d "+${HOURS} hours" "+%Y-%m-%d %H:%M:%S (Horário de Brasília)" 2>/dev/null || echo "Exclusão automática ativada em ${HOURS}h")

            # Monta a URL exata do SSH via navegador do GCP
            SSH_WEB_URL="https://ssh.cloud.google.com/v2/ssh/projects/project-5548564d-93e9-4f06-939/zones/$ZONE/instances/$INSTANCE_NAME?authuser=0&hl=en_US&projectNumber=309462774956&useAdminProxy=true"

            echo "### ✅ Máquina Virtual Provisionada com Sucesso!" >> $GITHUB_STEP_SUMMARY
            echo "- **Instância:** \`$INSTANCE_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Região/Zona:** \`$ZONE\`" >> $GITHUB_STEP_SUMMARY
            echo "- **IP Externo:** \`$EXT_IP\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⏱️ **Ciclo de Vida:**" >> $GITHUB_STEP_SUMMARY
            echo "- Esta máquina ficará ativa por **$HOURS hora(s)**." >> $GITHUB_STEP_SUMMARY
            echo "- **Previsão de exclusão automática:** \`$EXPIRY_TIME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔑 **Forma de Acesso:**" >> $GITHUB_STEP_SUMMARY
            echo "- **Via Navegador (Um clique):** [Abrir SSH no Browser]($SSH_WEB_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ O provisionamento falhou ou foi interrompido." >> $GITHUB_STEP_SUMMARY
            echo "Nenhum output foi gerado. Verifique os logs do Terraform acima." >> $GITHUB_STEP_SUMMARY
          fi